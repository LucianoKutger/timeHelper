services:
  - type: web
    name: timehelper-backend
    runtime: python
    rootDir: backend
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: APP_TIMEZONE
        value: Europe/Berlin
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WEBDE_USERNAME
        sync: false
      - key: WEBDE_APP_PASSWORD
        sync: false

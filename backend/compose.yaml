services:
  backend:
    container_name: timehelper-backend

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --reload
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    restart: unless-stopped